name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  AWS_REGION: us-east-1
  ECR_REPO: contacts-app
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read
  id-token: write # Required for AWS OIDC

jobs:
  build-and-push:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build-push.outputs.image_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC token
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          echo "Repository: ${REPO}"
          echo "Ref: ${REF}"
          echo "Actor: ${ACTOR}"
          echo "Token endpoint: ${ACTIONS_ID_TOKEN_REQUEST_URL}"
          echo "Token available: $(if [ -n "${TOKEN}" ]; then echo YES; else echo NO; fi)"
          echo ""
          echo "Fetching OIDC token (using request URL)..."
          FULL_TOKEN=$(curl -sL -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/json; api-version=2.0" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          echo "Response length: $(echo "${FULL_TOKEN}" | wc -c)"
          echo "Response start: $(echo "${FULL_TOKEN}" | head -c 200)"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::095232028249:role/GitHubActionsOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build-push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/contacts-app:${{ env.IMAGE_TAG }}
        run: |
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

  terraform-plan:
    name: Terraform Plan
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::095232028249:role/GitHubActionsOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="key=prod/terraform.tfstate" -backend-config="region=${{ env.AWS_REGION }}" -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform Plan
        id: plan
        working-directory: terraform
        run: terraform plan -var="image_tag=${{ env.IMAGE_TAG }}" -out=tfplan
        env:
          TF_IN_AUTOMATION: true

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan

  terraform-apply:
    name: Terraform Apply
    needs: [build-and-push, terraform-plan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: dev
      url: ${{ steps.terraform-output.outputs.alb_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::095232028249:role/GitHubActionsOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="key=prod/terraform.tfstate" -backend-config="region=${{ env.AWS_REGION }}" -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Import existing AWS resources into state (idempotent — skips already-imported)
        working-directory: terraform
        run: |
          import_if_missing() {
            local addr="$1" id="$2"
            if terraform state list | grep -qE "^${addr}\$"; then
              echo "✓ ${addr} already in state"
            else
              echo "→ Importing ${addr} (${id})"
              terraform import "$addr" "$id" || echo "✗ Failed to import ${addr}"
            fi
          }
          import_if_missing aws_vpc.main vpc-071672e2929deddd7
          import_if_missing aws_iam_role.task_execution contacts-app-ecs-exec-role
          import_if_missing aws_iam_role.task contacts-app-ecs-task-role
          import_if_missing aws_iam_openid_connect_provider.github arn:aws:iam::095232028249:oidc-provider/token.actions.githubusercontent.com
          import_if_missing aws_ecr_repository.app contacts-app
          import_if_missing aws_cloudwatch_log_group.ecs /ecs/contacts-app
        env:
          TF_IN_AUTOMATION: true

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform/

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan
        env:
          TF_IN_AUTOMATION: true

      - name: Terraform Outputs
        id: terraform-output
        working-directory: terraform
        run: |
          echo "alb_url=$(terraform output -raw alb_url 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
